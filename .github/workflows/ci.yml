name: CI Pipeline

on:
  pull_request:
    branches: [ main, uat, test, dev ]
  push:
    branches: [ main, uat, test, dev ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
        working-directory: Backend
      - run: node index.js || echo "Backend started check"
        working-directory: Backend
